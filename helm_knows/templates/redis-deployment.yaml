apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nickknows.redisName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "nickknows.redisName" . }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "nickknows.redisName" . }}
  template:
    metadata:
      labels:
        app: {{ include "nickknows.redisName" . }}
    spec:
      containers:
      - name: redis
        image: redis:latest
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "0.5"
            memory: 1Gi
