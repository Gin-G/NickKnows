apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: gingworker
      containers:
      - name: {{ .Values.webapp.name }}
        env:
        - name: FLASK_SECRET
          value: $MY_VALUE
        {{- if .Values.hydrowBroker.enabled }}
        - name: HYDROW_BROKER_URL
          value: http://{{ .Values.hydrowBroker.name }}:{{ .Values.hydrowBroker.container.port }}
        - name: HYDROW_BROKER_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.hydrowBroker.hmacSecretName }}
              key: hmac
        {{- end }}
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: {{ .Values.webapp.container.imagePullPolicy }}
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        volumeMounts:
        - name: data-volume
          mountPath: /NickKnows/app/nickknows/nfl/data
        - name: images-volume
          mountPath: /NickKnows/app/nickknows/static/images
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: {{ .Values.webapp.name }}-pvc-rook
      - name: images-volume
        persistentVolumeClaim:
          claimName: {{ .Values.webapp.name }}-images-pvc-rook