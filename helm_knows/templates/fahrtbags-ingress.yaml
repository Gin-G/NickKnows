{{- if .Values.fahrtbags.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fahrtbags-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
  annotations:
    external-dns.alpha.kubernetes.io/target: "8.44.158.127"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-fahrtbags-redirect@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      {{- range .Values.fahrtbags.hosts }}
      - {{ . }}
      {{- end }}
      secretName: nickknows-prod-tls
  rules:
  {{- range .Values.fahrtbags.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Values.webapp.name }}
            port:
              number: {{ $.Values.webapp.container.port }}
  {{- end }}
{{- end }}
