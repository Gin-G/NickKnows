apiVersion: v1
kind: Service
metadata:
  name: {{ include "nickknows.redisName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "nickknows.redisName" . }}
    group: {{ .Values.webapp.group }}
spec:
  ports:
    - name: redis
      port: 6379
      protocol: TCP
  selector:
    app: {{ include "nickknows.redisName" . }}