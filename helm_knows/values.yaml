webapp:
  name: nickknows-dev
  group: nickknows-dev
  fqdn: dev.nickknows.net
  path: /
  replicaCount: 1
  container:
    image: docker.io/ncging/nick-knows:2026-05-13.20.59
    imagePullPolicy: Always
    port: 8000
  storage:
    size: 2Gi
  # NOTE: previously the webapp container had two resources blocks and the
  # effective one was limits {cpu: '0', memory: '0'} — i.e. NO limit. That let
  # the NFL data pull (pandas, in-process) run unbounded and starve the node.
  # A real ceiling is set here; tune memory to the largest update you expect.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
gpuWorker:
  replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 10Gi
      nvidia.com/gpu: "1"
redis:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
flower:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
hydrowBroker:
  enabled: true
  name: hydrow-broker-dev
  replicaCount: 1
  container:
    image: docker.io/ncging/nick-knows:2026-05-13.20.59
    imagePullPolicy: Always
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # Both Secrets are expected to be provisioned by external-secrets.
  # credentialsSecretName must contain keys: email, password
  # hmacSecretName must contain key: hmac (any high-entropy string)
  credentialsSecretName: hydrow-credentials
  hmacSecretName: hydrow-broker-hmac
  externalSecrets:
    # Prod release in the same namespace owns the ExternalSecret/SecretStore
    # resources; dev reuses the k8s Secrets they create.
    enabled: false
    # Set createSecretStore: false if you already have a ClusterSecretStore
    # or a shared SecretStore in this namespace and want to reference it.
    createSecretStore: true
    secretStoreName: openbao-backend
    secretStoreKind: SecretStore
    openbaoServer: http://openbao.openbao.svc.cluster.local:8200
    openbaoMount: kv
    # OpenBao secret path under the mount (KV v2). All three keys
    # (email, password, hmac) are read from properties of this single
    # secret — see ESO docs for the resolved path conventions.
    openbaoPath: hydrow
    refreshInterval: 1h
